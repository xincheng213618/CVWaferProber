<?xml version="1.0" encoding="UTF-8"?>
<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <!-- 定义金属渐变与投影滤镜 -->
    <defs>
        <!-- 金属渐变 -->
        <linearGradient id="metalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#4a4a4a;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#2b2b2b;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
        </linearGradient>
        <!-- 内凹阴影，增强立体感 -->
        <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
            <feOffset dx="2" dy="2" result="offsetblur"/>
            <feComposite in="SourceGraphic" in2="offsetblur" operator="over"/>
        </filter>
        <!-- 外发光 -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- 齿轮主体：深色金属圆环 -->
    <circle cx="60" cy="60" r="50" fill="url(#metalGradient)" stroke="#222" stroke-width="2" filter="url(#innerShadow)"/>

    <!-- 齿轮齿：使用多边形路径绘制，更具机械感 -->
    <path d="M60,15 L65,15 L67,25 L73,25 L75,15 L80,15 L82,25 L88,25 L90,15 L95,15 L95,20 L105,20 L105,25 L95,25 L93,35 L87,35 L85,45 L95,45 L95,50 L85,50 L83,60 L93,60 L95,70 L85,70 L85,75 L95,75 L95,80 L85,80 L83,90 L93,90 L95,100 L85,100 L85,105 L95,105 L95,110 L85,110 L83,100 L77,100 L75,110 L70,110 L68,100 L62,100 L60,110 L55,110 L53,100 L47,100 L45,110 L40,110 L38,100 L28,100 L28,95 L38,95 L40,85 L28,85 L28,80 L40,80 L42,70 L28,70 L28,65 L42,65 L44,55 L28,55 L28,50 L44,50 L46,40 L28,40 L28,35 L46,35 L48,25 L28,25 L28,20 L48,20 L50,10 L55,10 L57,20 L63,20 L65,10 L70,10 L72,20 L78,20 L80,10 L85,10 L87,20 L97,20 L97,25 L87,25 L85,35 L91,35 L93,25 L99,25 L101,35 L107,35 L109,25 L115,25 L115,30 L105,30 L103,40 L109,40 L111,30 L117,30 L117,35 L111,35 L109,45 L115,45 L115,50 L109,50 L107,60 L117,60 L117,65 L107,65 L105,75 L115,75 L115,80 L105,80 L103,90 L115,90 L115,95 L103,95 L101,105 L115,105 L115,110 L101,110 L99,100 L93,100 L91,110 L86,110 L84,100 L78,100 L76,110 L71,110 L69,100 L63,100 L61,110 L56,110 Z"
          fill="#1a1a1a" stroke="#00B0F0" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- 中心孔与高光：增强精密感 -->
    <circle cx="60" cy="60" r="18" fill="#111" stroke-width="1" stroke="#333"/>
    <circle cx="60" cy="60" r="15" fill="url(#metalGradient)" filter="url(#glow)"/>
    <circle cx="60" cy="60" r="5" fill="#00B0F0" opacity="0.8"/>

    <!-- 中心高光点 -->
    <circle cx="60" cy="60" r="2" fill="#fff"/>
</svg>